name: pcp-conformance CI

# The conformance suite is the thing that decides whether an
# implementation is allowed to call itself PCP-compliant, so every
# check here is blocking. A failure means a test that passes for the
# wrong reason, which is worse than a missing test.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  conformance-tests:
    name: Conformance suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the suite
        run: pytest --asyncio-mode=auto -v

  # Guards against the single most damaging regression in a conformance
  # suite: a test that stops exercising anything and starts passing
  # vacuously. This is not hypothetical — a translation bug in the
  # pcp-spec model-checking tooling once made an invariant check pass
  # for the wrong reason, which is why that repository now ships
  # deliberately mutated models. Here, the equivalent smoke test is to
  # confirm the suite still collects exactly the tests it claims to.
  test-count:
    name: Test count guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Confirm the suite collects 42 tests
        # The previous version of this guard matched '^[0-9]+' against
        # pytest's summary line. That line is decorated with '=' on both
        # ends -- "==== 42 tests collected in 0.12s ====" -- so the regex
        # never matched, COLLECTED was always empty, and the guard failed
        # on every run. It looked like a working guard; it was the only
        # reason this job had never gone green. Match the count that
        # pytest actually labels, and fail loudly if the line is missing
        # so a pytest upgrade can't quietly turn it back into a no-op.
        run: |
          SUMMARY=$(pytest --collect-only -q 2>/dev/null | tail -1)
          echo "pytest summary: ${SUMMARY}"
          COLLECTED=$(printf '%s' "${SUMMARY}" | grep -oE '[0-9]+ tests? collected' | grep -oE '[0-9]+' | head -1)
          echo "collected: ${COLLECTED}"
          if [ -z "${COLLECTED}" ]; then
            echo "::error::Could not read a test count from pytest's summary line."
            exit 1
          fi
          if [ "${COLLECTED}" != "42" ]; then
            echo "::error::Expected 42 collected tests, got ${COLLECTED}."
            echo "A drop means tests were deleted or stopped being collected."
            echo "A rise means new tests were added — bump EXPECTED in this workflow."
            exit 1
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [conformance-tests, test-count]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## pcp-conformance CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| conformance-tests | ${{ needs.conformance-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test-count        | ${{ needs.test-count.result }}        |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All jobs are blocking. A red check here means the suite no" >> "$GITHUB_STEP_SUMMARY"
          echo "longer agrees with itself — treat it as a correctness" >> "$GITHUB_STEP_SUMMARY"
          echo "problem, not a flake." >> "$GITHUB_STEP_SUMMARY"
